name: Build & Compare Docker Image Sizes

on:
  pull_request:
  push:
    branches: ["develop"]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Start with node-naive. Add more variants as you create Dockerfiles.
          - name: node-naive
            context: apps/node-api
            dockerfile: dockerfiles/node/Dockerfile.naive
            tag: lab-node:naive
            container_name: ci-node-naive
            port: 3000
            health_path: /health

          - name: node-slim-cache
            context: apps/node-api
            dockerfile: dockerfiles/node/Dockerfile.slim-cache
            tag: lab-node:slim-cache
            container_name: ci-node-slim-cache
            port: 3000
            health_path: /health

          - name: node-alpine-cache
            context: apps/node-api
            dockerfile: dockerfiles/node/Dockerfile.alpine-cache
            tag: lab-node:alpine-cache
            container_name: ci-node-alpine-cache
            port: 3000
            health_path: /health

          - name: node-secure
            context: apps/node-api
            dockerfile: dockerfiles/node/Dockerfile.secure
            tag: lab-node:secure
            container_name: ci-node-secure
            port: 3000
            health_path: /health


    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          tags: ${{ matrix.tag }}
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (run container + curl health)
        run: |
          set -euo pipefail

          # Ensure clean start if a previous run left it behind
          docker rm -f "${{ matrix.container_name }}" >/dev/null 2>&1 || true

          docker run -d \
            --name "${{ matrix.container_name }}" \
            -p "${{ matrix.port }}:${{ matrix.port }}" \
            "${{ matrix.tag }}"

          # Small wait for app to start
          for i in {1..20}; do
            if curl -fsS "http://localhost:${{ matrix.port }}${{ matrix.health_path }}" >/dev/null; then
              echo "Health check OK"
              break
            fi
            sleep 0.5
            if [ "$i" -eq 20 ]; then
              echo "Health check failed. Container logs:"
              docker logs "${{ matrix.container_name }}" || true
              exit 1
            fi
          done

          docker rm -f "${{ matrix.container_name }}"

      - name: Measure image size
        run: |
          set -euo pipefail
          bytes=$(docker image inspect "${{ matrix.tag }}" --format '{{.Size}}')
          mb=$(python -c "print(f'{int($bytes)/1024/1024:.2f}')")
          echo "${{ matrix.name }},${{ matrix.tag }},$mb" | tee "size-${{ matrix.name }}.csv"

      - name: Upload size artifact
        uses: actions/upload-artifact@v4
        with:
          name: size-${{ matrix.name }}
          path: size-${{ matrix.name }}.csv

  report:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Download all size artifacts
        uses: actions/download-artifact@v4
        with:
          path: sizes
          pattern: size-*
          merge-multiple: true

      - name: Create Markdown size report
        run: |
          set -euo pipefail
          echo "| Variant | Image | Size (MB) |" > size-report.md
          echo "|---|---|---:|" >> size-report.md

          find sizes -name "*.csv" -type f -print0 | sort -z | xargs -0 cat | while IFS=, read -r name tag mb; do
            echo "| $name | \`$tag\` | $mb |" >> size-report.md
          done

          echo ""
          echo "===== SIZE REPORT ====="
          cat size-report.md

      - name: Upload combined report
        uses: actions/upload-artifact@v4
        with:
          name: image-size-report
          path: size-report.md